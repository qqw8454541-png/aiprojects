name: Daily LLM API Test

on:
  schedule:
    # 每天 UTC 时间 15:00 运行（对应北京时间 23:00 / 或 UTC 16:00 对应北京时间 00:00）
    # 下面设定为 UTC 16:00 (北京时间 0:00)
    - cron: '0 16 * * *'
  workflow_dispatch: # 允许手动触发
  push:
    branches:
      - main # 为了让你现在 push 就能立刻看到效果，先配置推送到 main 也触发

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Run Test Script
        run: node test_llm.mjs
